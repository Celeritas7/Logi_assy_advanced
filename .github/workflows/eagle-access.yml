name: Eagle workspace staging
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-contract:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node access/prepare-staging.mjs --fixture
